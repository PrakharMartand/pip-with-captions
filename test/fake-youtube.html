<!doctype html>
<!-- Minimal stand-in for YouTube's player markup: captions are DOM nodes
     inside .html5-video-player, not text tracks. -->
<html>
<head><meta charset="utf-8"><title>Fake YouTube</title></head>
<body>
  <div class="html5-video-player" style="position:relative;width:640px;height:360px">
    <div class="html5-video-container">
      <video muted style="width:640px;height:360px;left:0;top:0"></video>
    </div>
    <div class="ytp-caption-window-container"></div>
  </div>
  <script>
    const canvas = Object.assign(document.createElement('canvas'), { width: 320, height: 180 });
    const ctx = canvas.getContext('2d');
    setInterval(() => {
      ctx.fillStyle = `hsl(${Date.now() / 20 % 360} 50% 40%)`;
      ctx.fillRect(0, 0, 320, 180);
    }, 50);
    const video = document.querySelector('video');
    video.srcObject = canvas.captureStream(20);
    video.play();

    const captions = [['First YouTube caption'], ['Second caption,', 'on two lines'], []];
    const container = document.querySelector('.ytp-caption-window-container');
    let i = 0;
    setInterval(() => {
      const lines = captions[i++ % captions.length];
      container.innerHTML = lines.length
        ? '<div class="caption-window">' + lines.map((l) =>
            `<span class="caption-visual-line"><span class="ytp-caption-segment">${l}</span></span>`
          ).join('') + '</div>'
        : '';
    }, 1000);
    video.addEventListener('playing', () => (document.body.dataset.ready = '1'), { once: true });
  </script>
</body>
</html>
